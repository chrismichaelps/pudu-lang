name: release

# A release is cut only from main, only when a push changed the compiler package,
# and only when the package's version has no tag yet; scripts/release-plan.py
# decides, from the full list of changed paths. A push that changes only the
# README, the website, the examples, or the wiki does not start this workflow.
# The filter ignores those paths rather than naming the package's, because
# GitHub stops evaluating a path filter past 300 changed files, and a merge from
# dev is far larger than that: named paths would never match it and the release
# would silently not run. A release/ branch builds and checks the same archives
# without publishing them.
on:
  push:
    branches: [main, "release/**"]
    paths-ignore:
      - "README.md"
      - "CONTRIBUTING.md"
      - "website/**"
      - "examples/**"
      - "wiki/**"
      - "book/**"
      - "editors/**"
      - "public/**"
      - "deploy/**"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      build: ${{ steps.decide.outputs.build }}
      release: ${{ steps.decide.outputs.release }}
      prerelease: ${{ steps.decide.outputs.prerelease }}
      tag: ${{ steps.decide.outputs.tag }}
      version: ${{ steps.decide.outputs.version }}
      notes: ${{ steps.decide.outputs.notes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Test the release decision
        run: python3 test/release-plan.test.py
      - id: decide
        name: Decide
        env:
          REF_NAME: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          python3 scripts/release-plan.py --ref "$REF_NAME" --before "$BEFORE" --after "$AFTER" --base origin/main \
            | tee -a "$GITHUB_OUTPUT"

  archives:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-amd64
          - runner: macos-14
            target: darwin-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: 9.14.1
          cabal-version: 3.16.1.0
      - name: Install native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update || echo "some package indexes could not be read; continuing to the install"
          sudo apt-get install -y libffi-dev zlib1g-dev libgmp-dev
      - run: cabal update
      - name: Assemble archive
        shell: bash
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          binary="$(python3 scripts/build-package.py)"
          python3 scripts/package-binary.py --binary "$binary" --target "${{ matrix.target }}"
      - name: Run a program from the unpacked archive, outside the repository
        shell: bash
        run: |
          set -euo pipefail
          archive="$PWD/dist/packages/pudu-${{ needs.plan.outputs.version }}-${{ matrix.target }}.tar.gz"
          (cd dist/packages && shasum -a 256 -c "$(basename "$archive").sha256")
          away="$(mktemp -d)"
          tar -xzf "$archive" -C "$away"
          pudu="$away/pudu-${{ needs.plan.outputs.version }}-${{ matrix.target }}/bin/pudu"
          printf 'module Hello\n\nimport Std.Io as Io\n\nfn main() -> Int {\n  let _written = Io.writeLine("hello from the archive")\n  0\n}\n' > "$away/Hello.pudu"
          cd "$away"
          test "$(env -i HOME="$HOME" PATH=/usr/bin:/bin "$pudu" version)" = "pudu ${{ needs.plan.outputs.version }}"
          test "$(env -i HOME="$HOME" PATH=/usr/bin:/bin "$pudu" run Hello.pudu)" = "hello from the archive"
      - uses: actions/upload-artifact@v4
        with:
          name: pudu-${{ needs.plan.outputs.version }}-${{ matrix.target }}
          path: dist/packages/*
          if-no-files-found: error
          retention-days: 14

  # The runtime a program is attached to for a Linux server or a serverless
  # function, published beside the compiler so `pudu build --target` fetches it
  # instead of a developer building a toolchain for hours. Built in Alpine,
  # which is musl, from this same commit: the runtime carries the compiler's
  # source digest, which `pudu build --target` requires before using it.
  runtime-pack:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: alpine:3.20
    steps:
      - name: Install the toolchain musl needs
        run: |
          apk add --no-cache \
            bash binutils build-base coreutils curl git gmp-dev gnupg \
            libffi-dev ncurses-dev patchelf perl tar xz zlib-dev gzip
      - uses: actions/checkout@v7
      - name: Install GHC and cabal
        env:
          BOOTSTRAP_HASKELL_NONINTERACTIVE: 1
          BOOTSTRAP_HASKELL_MINIMAL: 1
          GHCUP_INSTALL_BASE_PREFIX: /opt
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://get-ghcup.haskell.org | sh
          /opt/.ghcup/bin/ghcup install ghc 9.10.1 --set
          /opt/.ghcup/bin/ghcup install cabal 3.12.1.0 --set
          echo "/opt/.ghcup/bin" >> "$GITHUB_PATH"
      - name: Build the runtimes
        shell: bash
        working-directory: packages/pudu/v0.1
        run: |
          set -euo pipefail
          cabal update
          cabal build exe:pudu --disable-tests --enable-optimization=2
          out="$GITHUB_WORKSPACE/dist/runtime"
          mkdir -p "$out"
          built="$(cabal list-bin exe:pudu --disable-tests --enable-optimization=2)"
          strip -o "$out/pudu-musl-x86_64" "$built"
          cp "$out/pudu-musl-x86_64" "$out/pudu-musl-lambda-x86_64"
          cp /lib/ld-musl-x86_64.so.1 "$out/ld-musl-x86_64.so.1"
          patchelf --set-interpreter /var/task/ld-musl-x86_64.so.1 "$out/pudu-musl-lambda-x86_64"
          for dependency in libffi.so.8 libz.so.1 libncursesw.so.6 libgmp.so.10; do
            resolved="$(ldd "$out/pudu-musl-x86_64" | awk -v wanted="$dependency" '$1 == wanted { print $3 }')"
            test -n "$resolved"
            cp -L "$resolved" "$out/$dependency"
            patchelf --replace-needed "$dependency" "/var/task/$dependency" "$out/pudu-musl-lambda-x86_64"
          done
          if ldd "$out/pudu-musl-x86_64" 2>&1 | grep -qi "libc\.so\.6\|GLIBC"; then
            echo "the runtime still needs glibc" >&2
            exit 1
          fi
          grep -c "PUDU-SOURCE-DIGEST:" "$out/pudu-musl-x86_64"
      - name: Attach a program to the stripped runtime and run it
        shell: bash
        run: |
          set -euo pipefail
          PUDU="$(cd packages/pudu/v0.1 && cabal list-bin exe:pudu --disable-tests --enable-optimization=2)"
          mkdir -p dist/probe
          printf 'module Probe\n\nimport Std.Io as Io\n\nfn main() -> Int {\n  let _said = Io.writeLine("probe on musl")\n  0\n}\n' > dist/probe/Probe.pudu
          "$PUDU" build dist/probe/Probe.pudu -o dist/probe/probe --runtime dist/runtime/pudu-musl-x86_64 2> dist/probe/said
          ! grep -q "other sources" dist/probe/said
          test "$(env -i dist/probe/probe)" = "probe on musl"
      - name: Compress and list the pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/runtime-pack
          cd dist/runtime
          sha256sum pudu-musl-x86_64 pudu-musl-lambda-x86_64 ld-musl-x86_64.so.1 libffi.so.8 libz.so.1 libncursesw.so.6 libgmp.so.10 \
            > ../runtime-pack/pudu-runtime-linux-musl-x86_64.sha256
          for file in *; do gzip -9 -n -c "$file" > "../runtime-pack/$file.gz"; done
          ls -l ../runtime-pack
      - uses: actions/upload-artifact@v4
        with:
          name: pudu-${{ needs.plan.outputs.version }}-runtime-linux-musl-x86_64
          path: dist/runtime-pack/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [plan, archives, runtime-pack]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
      NOTES: ${{ needs.plan.outputs.notes }}
      PRERELEASE: ${{ needs.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The archives land outside the working tree's own directories: a checkout puts the
      # compiler's sources at packages/pudu, so downloading beside them makes a directory
      # the asset list would match and the upload would refuse.
      - uses: actions/download-artifact@v4
        with:
          pattern: pudu-${{ needs.plan.outputs.version }}-*
          path: dist/release-assets
          merge-multiple: true
      - name: Tag the release
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists; nothing is published twice" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Pudu $VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
      # A release that fails partway leaves gh's own half-made release removed but the tag
      # pushed, and the tag step refuses a tag that exists; the tag goes with it so a re-run
      # publishes the same version rather than wedging it.
      - name: Publish the release
        run: |
          set -euo pipefail
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          assets=()
          while IFS= read -r asset; do assets+=("$asset"); done < <(find dist/release-assets -type f | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "no archives were downloaded for $VERSION" >&2
            exit 1
          fi
          if ! gh release create "$TAG" "${assets[@]}" --verify-tag --title "Pudu $VERSION" --notes-file "$NOTES" "${flags[@]}"; then
            git push --delete origin "refs/tags/$TAG"
            exit 1
          fi
