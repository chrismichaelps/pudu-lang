name: Raylib FFI integration

on:
  workflow_dispatch:
  pull_request:
    branches: [dev]
    paths:
      - ".github/workflows/raylib-integration.yml"
      - "cbits/pudu_ffi.c"
      - "pudu.cabal"
      - "src/Pudu/Eval/Foreign.hs"
      - "src/Pudu/Eval/Install.hs"
      - "src/Pudu/Foreign/**"
      - "src/Pudu/Frontend/Parser/Declaration/Foreign.hs"
      - "src/Pudu/Frontend/Syntax/Tree.hs"
      - "src/Pudu/Type/Check/Foreign.hs"
      - "test-fixtures/integration/UsesRaylib.pudu"
  schedule:
    - cron: "41 6 * * 1"

permissions:
  contents: read

concurrency:
  group: raylib-ffi-integration
  cancel-in-progress: false

env:
  RAYLIB_COMMIT: dbc56a87da87d973a9c5baa4e7438a9d20121d28

jobs:
  shared-library:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: 9.14.1
          cabal-version: 3.16.1.0
      - name: Install Raylib build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake \
            libasound2-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            libx11-dev
      - name: Build pinned Raylib shared library
        run: |
          git init "$RUNNER_TEMP/raylib"
          git -C "$RUNNER_TEMP/raylib" remote add origin https://github.com/raysan5/raylib.git
          git -C "$RUNNER_TEMP/raylib" fetch --depth 1 origin "$RAYLIB_COMMIT"
          git -C "$RUNNER_TEMP/raylib" checkout --detach FETCH_HEAD
          cmake \
            -S "$RUNNER_TEMP/raylib" \
            -B "$RUNNER_TEMP/raylib-build" \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/raylib-build" --parallel 2
      - run: cabal update
      - name: Call Raylib through Pudu's FFI
        env:
          LD_LIBRARY_PATH: ${{ runner.temp }}/raylib-build/raylib
        run: cabal run -v0 pudu -- run test-fixtures/integration/UsesRaylib.pudu
