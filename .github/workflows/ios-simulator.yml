name: iOS simulator
on:
  pull_request:
    paths:
      - 'packages/pudu/**'
      - 'cabal.project*'
      - 'test/ios-simulator.mjs'
      - 'test/ios-app-builds.mjs'
      - 'test/ios-foreign-apps.mjs'
      - 'examples/mobile/**'
      - 'scripts/uikit-coverage.mjs'
      - 'test/uikit-coverage.test.mjs'
      - 'wiki/architecture/NATIVE-IOS-UI.md'
      - '.github/workflows/ios-simulator.yml'
  push:
    branches: [dev, 'feature/**']
    paths:
      - 'packages/pudu/**'
      - 'cabal.project*'
      - 'test/ios-simulator.mjs'
      - 'test/ios-app-builds.mjs'
      - 'test/ios-foreign-apps.mjs'
      - 'examples/mobile/**'
      - 'scripts/uikit-coverage.mjs'
      - 'test/uikit-coverage.test.mjs'
      - 'wiki/architecture/NATIVE-IOS-UI.md'
      - '.github/workflows/ios-simulator.yml'

permissions:
  contents: read

concurrency:
  group: ios-simulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-ffi:
    runs-on: macos-26
    # The suite's parts are split across three jobs by PUDU_IOS_SHARD; one of
    # them boots the iPad matrix. Apps are built in parallel and cached by
    # content, so an unchanged example is not rebuilt.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: 9.14.1
          cabal-version: 3.16.1.0
      - name: Measure UIKit coverage against the runner's SDK
        run: |
          node --test test/uikit-coverage.test.mjs
          node scripts/uikit-coverage.mjs --check
      # Dependencies and the compiler tree are restored so only changed modules
      # recompile; recompilation is decided by source hashes.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/state/cabal/store
            ~/.cabal/store
          key: cabal-store-${{ runner.os }}-${{ hashFiles('**/*.cabal', 'cabal.project*') }}
          restore-keys: cabal-store-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: dist-newstyle
          key: ios-dist-${{ runner.os }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ios-dist-${{ runner.os }}-${{ github.ref }}-
            ios-dist-${{ runner.os }}-refs/heads/dev-
      - run: cabal update
      - name: Build Pudu
        run: cabal build exe:pudu --ghc-options=-Werror
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pudu-ios-suite
          key: ios-apps-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: ios-apps-${{ matrix.shard }}-
      - name: Run native foreign calls in an iOS app
        env:
          PUDU_IOS_SHARD: ${{ matrix.shard }}/3
          # A hosted runner has few cores; two builds at a time keep the
          # simulator responsive, and the C compiler gets room to finish.
          PUDU_IOS_BUILD_JOBS: '2'
          PUDU_CC_TIMEOUT: '600'
        run: node test/ios-simulator.mjs "$(cabal list-bin exe:pudu --ghc-options=-Werror)" --require-simulator
